<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">

<title>Dungeon Scrolling</title>
<style>
  html, body {
    margin: 0; height: 100%; background: #08070c; overflow: hidden;
  }
  body {
    display: flex; align-items: center; justify-content: center;
    font-family: ui-monospace, Consolas, monospace;
    -webkit-user-select: none; user-select: none;
  }
  /* One canvas: the world, the HUD and the menus are all Three.js now.
     focusable + no outline because the game, not the host page, owns the
     keyboard: with focus on the canvas, Tab and Escape reach the game instead
     of walking the host's focus order. */
  canvas#game3d {
    image-rendering: pixelated;
    image-rendering: crisp-edges;
    display: block;
    position: fixed;
    left: 0;
    top: 0;
    outline: none;
    /* One cursor only: the game's own. The pointer is drawn in screen pixels
       (see src/ui/pointer.js) so it is the same size on every monitor. */
    cursor: none;
  }
</style>
<link rel="stylesheet" href="./styles/ui.css?v=7.1.0">
<link rel="stylesheet" href="./styles/panels.css?v=7.1.0">
